
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Portal Games</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Portal Games</a>
        
<button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menuPrincipal"
        aria-controls="menuPrincipal"
        aria-expanded="false"
        aria-label="Abrir menu">
    <span class="navbar-toggler-icon"></span>
</button>



<div class="collapse navbar-collapse" id="menuPrincipal">
    <div class="navbar-nav gap-lg-3">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="sobre.html">Sobre</a>
        <a class="nav-link" href="galeria.html">Galeria</a>
        <a class="nav-link" href="dados.html">Dados</a>
        <a class="nav-link" href="contato.html">Contato</a>
    </div>
</div>
</nav>

    <main class="container">
        <h1>Entre em Contato</h1>

        <p>
            Tem alguma dúvida ou sugestão sobre
            a história dos videogames?
            Envie sua mensagem!
        </p>
        
<form>
    <div class="mb-3">
        <label for="nome" class="form-label">
            Nome completo
        </label>

        <input type="text"
               class="form-control"
               id="nome"
               name="nome"
               placeholder="Digite seu nome"
               required>
    </div>
    
<div class="mb-3">
    <label for="email" class="form-label">
        E-mail
    </label>

    <input type="email"
           class="form-control"
           id="email"
           name="email"
           placeholder="Digite seu e-mail"
           required>
</div>

<div class="mb-3">
    <label for="assunto" class="form-label">
        Assunto
    </label>

    <select class="form-select"
            id="assunto"
            name="assunto"
            required>

        <option value="" selected disabled>
            Selecione um assunto
        </option>

        <option value="duvida">Dúvida</option>
        <option value="sugestao">Sugestão</option>
        <option value="jogos">Jogos clássicos</option>
        <option value="outros">Outros</option>

    </select>
</div>

<div class="mb-3">
    <label for="mensagem" class="form-label">
        Mensagem
    </label>

    <textarea class="form-control"
              id="mensagem"
              name="mensagem"
              rows="5"
              placeholder="Digite sua mensagem aqui..."
              required></textarea>
</div>

<div class="form-check mb-3">
    <input class="form-check-input"
           type="checkbox"
           id="confirmacao"
           name="confirmacao"
           required>

    <label class="form-check-label" for="confirmacao">
        Confirmo que preenchi os dados corretamente.
    </label>
</div>

<button type="submit" class="btn btn-primary">
    Enviar mensagem
</button>

</form>

    </main>
<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        <p class="mb-1">Portal Games — História dos Videogames</p>
        <small>Projeto desenvolvido para fins educativos.</small>
    </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
