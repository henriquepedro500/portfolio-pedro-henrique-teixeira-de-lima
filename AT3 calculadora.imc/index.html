<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora de IMC</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background-color: #ffffff;
    color: #000000;
  }
  h1 {
    font-size: 22px;
    color: #2a6f2a;
  }
  label {
    display: block;
    margin-top: 12px;
  }
  input {
    padding: 5px;
    margin-top: 3px;
    border: 1px solid #999999;
  }
  button {
    margin-top: 18px;
    padding: 8px 16px;
    background-color: #2a6f2a;
    color: #ffffff;
    border: none;
  }
  button:hover {
    background-color: #1f5a1f;
  }
  #resultado {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #2a6f2a;
  }
</style>
</head>
<body>

<h1>Calculadora de IMC</h1>

<!-- Campo de entrada de peso -->
<label for="peso">Peso (kg):</label>
<input type="number" id="peso" step="0.1">

<!-- Campo de entrada de altura -->
<label for="altura">Altura (m):</label>
<input type="number" id="altura" step="0.01">

<br>
<button onclick="calcularIMC()">Calcular</button>

<!-- Tag HTML que exibe o resultado -->
<div id="resultado"></div>

<script>
function calcularIMC() {
  var peso = parseFloat(document.getElementById("peso").value);
  var altura = parseFloat(document.getElementById("altura").value);
  var resultadoDiv = document.getElementById("resultado");

  if (!peso || !altura) {
    alert("Preencha peso e altura.");
    return;
  }

  // Cálculo do IMC: peso dividido pela altura ao quadrado
  var imc = peso / (altura * altura);

  // Classificação conforme a tabela para adultos
  var categoria = "";
  if (imc < 18.5) {
    categoria = "Baixo peso";
  } else if (imc < 25) {
    categoria = "Peso normal";
  } else if (imc < 30) {
    categoria = "Sobrepeso";
  } else if (imc < 35) {
    categoria = "Obesidade grau I";
  } else if (imc < 40) {
    categoria = "Obesidade grau II";
  } else {
    categoria = "Obesidade grau III (mórbida)";
  }

  resultadoDiv.innerHTML = "Seu IMC é: " + imc.toFixed(2) + " kg/m² - " + categoria;
}
</script>

</body>
</html>
